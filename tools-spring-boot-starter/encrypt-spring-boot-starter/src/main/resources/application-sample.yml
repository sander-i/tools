#----------------------------------- encrypt 配置样例 -----------------------------------#
#
# 本文件是配置样例，不会被 Spring Boot 自动加载。
# 使用时复制为 application.yml，再按需替换密钥。
#
# 密钥说明：
#   - 对称密钥可写明文，也可写 hex: 前缀的十六进制编码。
#     下面给出的是 hex: 形式，由对应 *KeyGenerator.getSecretKeyStr() 生成。
#   - 非对称密钥为 Base64 编码的 PKCS#8 / X.509 内容，由 RsaKeyGenerator 生成。
#   - 下面的密钥仅用于演示与本地测试，生产环境请自行生成并妥善保管，
#     切勿把生产密钥提交到代码仓库。

tools:
  encrypt:
    enabled: true
    asymmetric:
      rsa:
        enabled: true
        # 2048 位演示密钥
        public-key: ""
        private-key: ""
        group-enabled: true
        group:
          - name: sample1
            public-key: ""
            private-key: ""
          - name: sample2
            public-key: ""
            private-key: ""
    symmetrical:
      aes:
        enabled: true
        secret-key: "hex:05a8ea6198f2bcf7a3049e7e6eb1bc30"
        group-enabled: true
        group:
          - name: sample1
            secret-key: "hex:c308b25570d049c81854201ab8b80489"
      des:
        enabled: true
        secret-key: "hex:2989d5684540c7fb"
        group-enabled: true
        group:
          - name: sample1
            secret-key: "hex:b93179f7ef4085b5"
      idea:
        enabled: true
        secret-key: "hex:8487cec3f4ad2f3e66d613039be67a38"
        group-enabled: true
        group:
          - name: sample1
            secret-key: "hex:93439324e0855682a0443c97070ad1cc"
