# 构建与测试验证（草案）
#
# 说明：本仓库当前托管于 Gitee（https://gitee.com/sander-o/tools），
# Gitee Go 的流水线配置格式与 GitHub Actions 不同，本文件为可移植的
# GitHub Actions 草案；如落地 Gitee Go，请按其语法将 steps 转换为对应 job 配置，
# 核心命令保持一致：
#   mvn -B -DskipTests=false test
#
# 注意：根 pom.xml 默认 skipTests=true（只编译不执行），因此所有测试命令
# 必须显式携带 -DskipTests=false。
name: ci

on:
  push:
    branches: [ main, release ]
  pull_request:
    branches: [ main, release ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # 默认构建（与发布流程一致，跳过测试执行）
      - name: Build
        run: mvn -B -q validate

      # 执行单元测试（encrypt 旗舰模块优先，全模块跟随其后）
      - name: Test
        run: mvn -B -DskipTests=false test
