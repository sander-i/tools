spring:
  application:
    name: example-encrypt-spring-boot-starter
server:
  servlet:
    context-path: /${spring.application.name}
  port: 8080

#-----------------------------------encrypt-??-----------------------------------#
tools:
  encrypt:
    enabled: true
    asymmetric:
      rsa:
        enabled: true
        public-key: ""
        private-key: ""
        group-enabled: true
        group:
          - name: pwd
            public-key: ""
            private-key: ""
          - name: email
            public-key: ""
            private-key: ""
    symmetrical:
      aes:
        enabled: true
        secret-key: "BeYourself"
#        group-enabled: true
#        group:
#          - name: pwd
#            secret-key: "BeYourself"
#          - name: id-card
#            secret-key: "BeYourself"
      des:
        enabled: true
        secret-key: "12345678"
        group-enabled: false
        group:
          - name: phone
            secret-key: "BeYourself"
          - name: email
            secret-key: "BeYourself"
